include: package:flutter_lints/flutter.yaml

# 'unnecessary_import' is an analyzer diagnostic (not a linter rule), so it is
# silenced here under analyzer.errors rather than under linter.rules.
analyzer:
  errors:
    unnecessary_import: ignore

# Relax a few purely-cosmetic style lints so they don't fail the CI build.
# They have no effect on how the app runs.
linter:
  rules:
    prefer_const_constructors: false
    prefer_const_constructors_in_immutables: false
    prefer_const_literals_to_create_immutables: false
    prefer_final_locals: false
