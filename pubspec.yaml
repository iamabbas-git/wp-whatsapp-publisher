name: wp_wa_publisher
description: "Write once, publish to your WordPress site, and hand off to WhatsApp groups."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Rich text editor (Delta model, converts cleanly to HTML for WordPress).
  # Pinned exactly: flutter_quill's API changes between majors, and the compose
  # screen below is written against this specific version's API.
  flutter_quill: 10.8.5
  vsc_quill_delta_to_html: ^1.0.5

  # WhatsApp-style emoji picker
  emoji_picker_flutter: ^3.1.0

  # Networking + secure credential storage
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Local draft storage
  shared_preferences: ^2.3.2

  # Featured image picking + file sharing
  image_picker: ^1.1.2
  cross_file: ^0.3.4+2

  # Sharing / opening WhatsApp
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
